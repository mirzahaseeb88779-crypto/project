<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Syed Shuja</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500&family=Inter:wght@400;700;900&family=Montserrat:wght@600;700&display=swap');

        :root {
            --bg-color: #ece9e2;
            --text-color: #0a0a0a;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: var(--bg-color);
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-color);
        }

        body.menu-open { overflow: hidden; }

        /* ─── TOP BAR: home icon + "menu" + hamburger ─── */
        .top-bar {
            position: fixed;
            top: 38px;
            right: 40px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .menu-btn {
            width: 35px;
            height: 22px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-btn .line {
            width: 100%;
            height: 3px;
            background-color: var(--text-color);
            border-radius: 2px;
            transition: all 0.3s ease-in-out;
        }

        .menu-btn.open .line:nth-child(1) { transform: translateY(9.5px) rotate(45deg); }
        .menu-btn.open .line:nth-child(2) { opacity: 0; }
        .menu-btn.open .line:nth-child(3) { transform: translateY(-9.5px) rotate(-45deg); }

        /* ─── NAV OVERLAY ─── */
        .nav-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(236, 233, 226, 0.98);
            z-index: 150;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .nav-overlay.open { opacity: 1; visibility: visible; }

        .nav-links {
            display: flex;
            flex-direction: column;
            text-align: center;
            gap: 30px;
            transform: translateY(20px);
            transition: transform 0.4s ease;
        }

        .nav-overlay.open .nav-links { transform: translateY(0); }

        .nav-links a {
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 900;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: -0.04em;
            line-height: 1;
            transition: color 0.3s, transform 0.3s;
        }

        .nav-links a:hover { color: #777; transform: scale(1.05); }

        /* =====================================================
           CONTACT
        ===================================================== */
        .contact-section {
            width: 100%;
            min-height: 100vh;
            padding: 56px 56px 80px;
        }

        .contact-inner {
            width: 100%;
            max-width: 2200px;
            margin: 0 auto;
        }

        .contact-heading {
            margin: 0;
            font-family: 'Alegreya', serif;
            font-size: clamp(44px, 4.6vw, 76px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -.02em;
        }

        .contact-lead {
            margin: clamp(60px, 11vw, 150px) 0 0;
            max-width: 520px;
            font-family: 'Alegreya', serif;
            font-size: clamp(32px, 3.55vw, 58px);
            font-weight: 400;
            line-height: 1.02;
            letter-spacing: -.02em;
        }

        .contact-links {
            margin: 28px 0 0;
            padding: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-links a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Montserrat', 'Inter', sans-serif;
            font-size: clamp(12px, 1vw, 15px);
            font-weight: 700;
            letter-spacing: -.01em;
            color: var(--text-color);
            text-decoration: none;
            transition: opacity .25s;
        }

        .contact-links a:hover { opacity: .6; }

        .contact-links svg {
            width: clamp(26px, 2.4vw, 32px);
            height: clamp(26px, 2.4vw, 32px);
            flex: none;
            display: block;
        }

        /* ─── MOBILE ─── */
        @media (max-width: 900px) {
            .top-bar { top: 22px; right: 22px; gap: 14px; }
            .menu-btn { width: 32px; height: 20px; }
            .menu-btn.open .line:nth-child(1) { transform: translateY(8.5px) rotate(45deg); }
            .menu-btn.open .line:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); }
            .nav-links a { font-size: 44px; }

            .contact-section { padding: 40px 22px 60px; }
            .contact-lead { margin-top: 56px; font-size: 34px; }
            .contact-links a { font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="menu-btn" id="menu-btn" role="button" aria-label="Open menu">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </div>

    <div class="nav-overlay" id="nav-overlay">
        <nav class="nav-links">
            <a href="index.html">Hello</a>
            <a href="index.html#work">Work</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>

    <!-- CONTACT -->
    <section class="contact-section" id="contact">
        <div class="contact-inner">

            <h1 class="contact-heading">contact</h1>

            <p class="contact-lead">
                A big idea, a bold pitch,<br>
                or something interesting<br>
                brewing? Let’s talk.
            </p>

            <ul class="contact-links">
                <li>
                    <a href="mailto:shuja.syedhussain@gmail.com">
                        <svg viewBox="0 0 32 32" aria-hidden="true">
                            <defs>
                                <linearGradient id="gm" x1="0" y1="0" x2="1" y2="0">
                                    <stop offset="0" stop-color="#8c8c8c"/>
                                    <stop offset="1" stop-color="#c9c9c9"/>
                                </linearGradient>
                            </defs>
                            <path d="M2 8.2 16 19 30 8.2V25a1.5 1.5 0 0 1-1.5 1.5H25V13.6L16 20.5 7 13.6v12.9H3.5A1.5 1.5 0 0 1 2 25V8.2Z" fill="url(#gm)"/>
                            <path d="M2 8.2a2.2 2.2 0 0 1 3.5-1.8L16 14.3l10.5-7.9A2.2 2.2 0 0 1 30 8.2L16 19 2 8.2Z" fill="#6f6f6f"/>
                        </svg>
                        shuja.syedhussain@gmail.com
                    </a>
                </li>
                <li>
                    <a href="https://linkedin.com/in/theshuj" target="_blank" rel="noopener">
                        <svg viewBox="0 0 32 32" aria-hidden="true">
                            <rect x="1" y="1" width="30" height="30" rx="7" fill="#0a0a0a"/>
                            <rect x="6.2" y="12.4" width="4.4" height="13.4" fill="#ece9e2"/>
                            <circle cx="8.4" cy="8.4" r="2.6" fill="#ece9e2"/>
                            <path d="M13.6 12.4h4.2v1.9c.8-1.4 2.4-2.3 4.4-2.3 3.6 0 5 2.2 5 5.8v8h-4.4v-7.1c0-1.7-.6-2.8-2.1-2.8-1.7 0-2.7 1.2-2.7 3.1v6.8h-4.4V12.4Z" fill="#ece9e2"/>
                        </svg>
                        linkedin.com/in/theshuj
                    </a>
                </li>
            </ul>

        </div>
    </section>

    <script>
        const menuBtn    = document.getElementById('menu-btn');
        const navOverlay = document.getElementById('nav-overlay');

        function toggleMenu(force) {
            const open = typeof force === 'boolean' ? force : !navOverlay.classList.contains('open');
            menuBtn.classList.toggle('open', open);
            navOverlay.classList.toggle('open', open);
            document.body.classList.toggle('menu-open', open);
        }

        menuBtn.addEventListener('click', () => toggleMenu());

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => toggleMenu(false));
        });
    </script>

</body>
</html>
