<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Selected work by Syed Shuja Hussain — design, art direction and film craft.">
    <title>Work - Syed Shuja</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500&family=Figtree:wght@400;500;700;900&family=Inter:wght@400;500;700;900&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap');

        /* =====================================================
           TOKENS
        ===================================================== */
        :root {
            --bg: #ece9e2;
            --ink: #0a0a0a;
            --ink-soft: #2a2927;
            --muted: #8c8881;
            --muted-light: #b9b5ad;
            --line: rgba(10, 10, 10, .85);

            --serif: 'Alegreya', Georgia, serif;
            --sans: 'Inter', system-ui, sans-serif;
            --geo: 'Montserrat', 'Inter', sans-serif;

            --gutter: clamp(20px, 3.6vw, 56px);
            --max: 1760px;
            --ease: cubic-bezier(.22, .61, .36, 1);
        }

        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            overflow-x: hidden;
        }

        body.lock { overflow: hidden; }

        img { max-width: 100%; }
        a { color: inherit; }
        :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 4px; }

        /* =====================================================
           TOP BAR
        ===================================================== */
        .top-bar {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 200;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 18px;
            padding: 30px max(var(--gutter), env(safe-area-inset-right)) 18px max(var(--gutter), env(safe-area-inset-left));
            transition: background .3s, padding .3s, box-shadow .3s;
        }

        .top-bar.scrolled {
            padding-top: 16px;
            padding-bottom: 14px;
            background: rgba(236, 233, 226, .86);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: 0 1px 0 rgba(10, 10, 10, .08);
        }

        .home-link, .menu-label { display: none; }
        body[data-view="project"] .home-link { display: flex; }
        body[data-view="project"] .menu-label { display: block; }

        .home-link svg { width: 24px; height: 24px; display: block; }

        .menu-label {
            font-family: var(--serif);
            font-size: 15px;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }

        .menu-btn {
            width: 34px;
            height: 22px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-btn .line {
            display: block;
            width: 100%;
            height: 3px;
            background: var(--ink);
            border-radius: 2px;
            transition: transform .3s var(--ease), opacity .3s;
        }

        .menu-btn.open .line:nth-child(1) { transform: translateY(9.5px) rotate(45deg); }
        .menu-btn.open .line:nth-child(2) { opacity: 0; }
        .menu-btn.open .line:nth-child(3) { transform: translateY(-9.5px) rotate(-45deg); }

        .nav-overlay {
            position: fixed;
            inset: 0;
            z-index: 150;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(236, 233, 226, .98);
            opacity: 0;
            visibility: hidden;
            transition: opacity .4s ease, visibility .4s ease;
        }

        .nav-overlay.open { opacity: 1; visibility: visible; }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 28px;
            text-align: center;
            transform: translateY(20px);
            transition: transform .4s var(--ease);
        }

        .nav-overlay.open .nav-links { transform: none; }

        .nav-links a {
            font-size: clamp(40px, 8vw, 80px);
            font-weight: 900;
            letter-spacing: -.04em;
            line-height: 1;
            text-decoration: none;
            transition: color .3s, transform .3s;
        }

        .nav-links a:hover { color: #777; transform: scale(1.04); }

        /* =====================================================
           SHARED
        ===================================================== */
        .wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding-inline: var(--gutter); }
        .rule { display: block; width: 44px; height: 4px; margin: 0; border: 0; background: var(--ink); }

        .pill {
            display: inline-flex;
            align-items: center;
            padding: 6px 14px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            font-family: var(--geo);
            font-size: 11px;
            font-weight: 500;
            line-height: 1;
            text-decoration: none;
            white-space: nowrap;
            color: var(--ink);
            background: transparent;
            transition: background .25s, color .25s;
        }

        .pill.solid { background: var(--ink); color: #fff; }
        .pill:hover { background: var(--ink); color: #fff; }
        .pill.solid:hover { background: #3a3835; }

        .tile {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #d9d5cd, #cfcac1);
        }

        .tile img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .9s var(--ease); }
        .tile.missing img { visibility: hidden; }

        .view { transition: opacity .3s ease; }
        .view.fade { opacity: 0; }

        /* =====================================================
           GRID VIEW
        ===================================================== */
        .grid-view { min-height: 100vh; padding-block: clamp(70px, 6vw, 96px) 80px; }

        .work-heading {
            display: block;
            margin: 8px 0 14px;
            font-family: var(--serif);
            font-size: clamp(54px, 7vw, 120px);
            font-weight: 400;
            line-height: .95;
            letter-spacing: -.03em;
        }

        .work-intro {
            max-width: 720px;
            margin: 0 0 clamp(30px, 4vw, 54px);
            font-family: var(--serif);
            font-size: clamp(17px, 1.5vw, 25px);
            line-height: 1.3;
            color: var(--muted);
        }

        .work-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 5px;
        }

        .work-card {
            position: relative;
            display: block;
            aspect-ratio: 311 / 270;
            overflow: hidden;
            background: #d9d5cd;
            text-decoration: none;
            color: #fff;
            opacity: 0;
            transform: translateY(26px);
            transition: opacity .7s ease, transform .7s ease;
        }

        .work-card.in { opacity: 1; transform: none; }

        .work-card img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
        .work-card::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, .45); transition: background .4s; }
        .work-card:hover::after { background: rgba(0, 0, 0, .6); }
        .work-card:hover img { transform: scale(1.055); }

        .card-caption {
            position: absolute;
            z-index: 2;
            left: 55%;
            top: 50%;
            width: 40%;
            transform: translateY(-50%);
        }

        .card-client { display: block; margin-bottom: 5px; font-family: var(--serif); font-size: clamp(18px, 1.9vw, 28px); line-height: 1.02; }
        .card-title  { display: block; font-family: var(--serif); font-size: clamp(12px, 1vw, 15px); line-height: 1.12; }
        .card-caption::after { content: ''; display: block; width: 31px; height: 2px; margin-top: 13px; background: #fff; }

        /* =====================================================
           PROJECT VIEW
        ===================================================== */
        .project-view { min-height: 100svh; padding-block: clamp(70px, 6vw, 96px) 50px; }

        .p-back {
            display: inline-block;
            margin-top: 8px;
            font-family: var(--serif);
            font-size: clamp(38px, 4.8vw, 80px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -.02em;
            text-decoration: none;
        }

        .p-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin-top: clamp(26px, 3.4vw, 54px);
        }

        .p-title { margin: 0; font-weight: 400; line-height: 1.1; }

        .p-client {
            display: block;
            font-family: var(--serif);
            font-size: clamp(32px, 3.9vw, 66px);
            letter-spacing: -.02em;
        }

        .p-name {
            display: block;
            margin-top: 2px;
            font-family: var(--geo);
            font-size: clamp(26px, 3.4vw, 58px);
            font-weight: 500;
            letter-spacing: -.025em;
        }

        .p-name .extra { font-family: var(--serif); font-weight: 400; letter-spacing: -.02em; font-size: 1.12em; }

        .p-nav { display: flex; gap: clamp(22px, 3.6vw, 60px); padding-top: 10px; }

        .p-nav a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--geo);
            font-size: clamp(11px, .95vw, 15px);
            color: var(--muted);
            text-decoration: none;
            white-space: nowrap;
            transition: color .25s;
        }

        .p-nav a:hover { color: var(--ink); }
        .p-nav svg { width: clamp(24px, 2.6vw, 38px); height: 14px; }

        /* credits */
        .credits { margin-top: clamp(18px, 2vw, 30px); color: var(--muted-light); }
        .credits .agency { font-family: var(--serif); font-size: clamp(15px, 1.35vw, 22px); line-height: 1.1; }
        .credits .role { font-family: var(--serif); font-size: clamp(9px, .72vw, 11px); line-height: 1.15; }

        /* award row */
        .awards { display: flex; flex-wrap: wrap; align-items: center; gap: 14px clamp(14px, 2vw, 30px); margin-top: 18px; }
        .awards .logo { height: clamp(26px, 3vw, 44px); }

        /* gallery */
        .gallery { display: grid; gap: 4px; margin-top: clamp(16px, 2vw, 28px); }

        .gallery.A { grid-template-columns: 2.05fr 1fr; grid-template-rows: 1fr 1fr; aspect-ratio: 2.7 / 1; }
        .gallery.A .tile:nth-child(1) { grid-row: 1 / 3; }

        .gallery.B { grid-template-columns: 1fr 2.05fr; grid-template-rows: 1fr 1fr; aspect-ratio: 2.7 / 1; }
        .gallery.B .tile:nth-child(1) { grid-column: 2; grid-row: 1 / 3; }
        .gallery.B .tile:nth-child(2) { grid-column: 1; grid-row: 1; }
        .gallery.B .tile:nth-child(3) { grid-column: 1; grid-row: 2; }

        .gallery.wide { grid-template-columns: 1fr; }
        .gallery.duo  { grid-template-columns: 1fr 1.35fr; }

        .gallery .tile { min-height: 0; }
        .gallery.wide .tile, .gallery.duo .tile { aspect-ratio: var(--ratio, 2.4 / 1); }
        .gallery.duo .tile { aspect-ratio: auto; height: 100%; }
        .gallery.duo { aspect-ratio: var(--ratio, 1.65 / 1); }

        .p-deck { margin-top: 16px; }

        /* body */
        .p-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, .95fr);
            column-gap: clamp(32px, 5vw, 90px);
            align-items: start;
            margin-top: clamp(24px, 2.8vw, 44px);
        }

        .p-body.solo { grid-template-columns: minmax(0, 1fr); }
        .p-body.split { grid-template-columns: repeat(2, minmax(0, 1fr)); }

        .sec { margin-bottom: clamp(14px, 1.4vw, 22px); }
        .sec h3 { margin: 0 0 1px; font-family: var(--serif); font-size: clamp(17px, 1.5vw, 25px); font-weight: 400; line-height: 1.1; }
        .sec p  { margin: 0; max-width: 560px; font-family: var(--serif); font-size: clamp(13px, 1vw, 16px); line-height: 1.2; color: var(--ink-soft); }

        .p-body.split .col + .col { padding-top: clamp(0px, 1vw, 14px); }

        /* media */
        .video-card {
            padding: clamp(10px, 1vw, 16px);
            border: 1.5px solid var(--line);
            border-radius: clamp(26px, 2.6vw, 38px);
        }

        .video-frame {
            position: relative;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: clamp(18px, 2vw, 28px);
            background: #1b1b1b;
        }

        .video-frame > img, .video-frame video, .video-frame iframe {
            position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover;
        }

        .play-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: clamp(74px, 9vw, 108px);
            height: clamp(50px, 6vw, 70px);
            border: 0;
            border-radius: 18px;
            background: rgba(0, 0, 0, .86);
            color: #fff;
            cursor: pointer;
            transition: transform .25s var(--ease), background .25s;
        }

        .play-btn:hover { transform: translate(-50%, -50%) scale(1.06); background: #000; }
        .play-btn svg { width: 38%; height: auto; }
        .play-btn span { font-family: var(--serif); font-size: 9px; opacity: .85; }

        .logos { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px clamp(14px, 2vw, 30px); margin-top: 18px; }
        .logos.left { justify-content: flex-start; }
        .logos .logo { height: clamp(22px, 2.4vw, 36px); width: auto; }
        .logos.small .logo { height: 18px; }
        .logo-text { font-family: var(--geo); font-size: clamp(11px, .95vw, 15px); font-weight: 600; letter-spacing: -.01em; }

        /* appendix */
        .appendix { margin-top: clamp(30px, 3.6vw, 56px); }
        .appendix h2 { margin: 0 0 14px; font-family: var(--geo); font-size: clamp(20px, 1.8vw, 28px); font-weight: 400; color: var(--muted); }
        .appendix ul { margin: 0; padding: 0; list-style: none; columns: 2; column-gap: clamp(32px, 5vw, 90px); }
        .appendix li { break-inside: avoid; margin-bottom: 14px; }
        .appendix b { display: block; font-family: var(--geo); font-size: clamp(11px, .9vw, 14px); font-weight: 600; color: #a3a099; }
        .appendix a { display: block; max-width: 520px; font-family: var(--geo); font-size: clamp(8px, .66vw, 10px); line-height: 1.25; color: var(--muted-light); text-decoration: none; word-break: break-all; }
        .appendix a:hover { color: var(--ink); text-decoration: underline; }

        .p-end { margin-top: 30px; }

        /* =====================================================
           RESPONSIVE
        ===================================================== */
        @media (min-width: 1800px) { :root { --max: 2000px; } }

        @media (max-width: 1100px) {
            .p-body { grid-template-columns: minmax(0, 1fr); row-gap: 28px; }
            .p-body.split { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }

        @media (max-width: 900px) {
            .top-bar { padding-top: 20px; }
            .menu-btn { width: 32px; height: 20px; }
            .menu-btn.open .line:nth-child(1) { transform: translateY(8.5px) rotate(45deg); }
            .menu-btn.open .line:nth-child(3) { transform: translateY(-8.5px) rotate(-45deg); }
            .nav-links a { font-size: 44px; }

            .work-grid { gap: 3px; }
            .card-caption { left: 48%; width: 48%; }
            .card-client { font-size: clamp(13px, 3.4vw, 21px); margin-bottom: 3px; }
            .card-title { font-size: clamp(9px, 2.35vw, 14px); line-height: 1.08; }
            .card-caption::after { width: 22px; margin-top: 8px; }

            .p-head { flex-direction: column; gap: 6px; }
            .p-nav { width: 100%; justify-content: space-between; padding-top: 14px; }
            .gallery.A, .gallery.B { aspect-ratio: 2.2 / 1; }
            .appendix ul { columns: 1; }
        }

        @media (max-width: 600px) {
            :root { --gutter: 16px; }
            .grid-view { padding-top: 84px; }
            .project-view { padding-top: 84px; }
            .work-grid { gap: 2px; }
            .card-caption { left: 46%; width: 51%; }
            .card-client { font-size: 12px; }
            .card-title { font-size: 8.5px; }
            .p-back { font-size: 34px; }
            .p-client { font-size: 30px; }
            .p-name { font-size: 22px; }
            .p-nav a { font-size: 12px; gap: 6px; }
            .p-nav svg { width: 22px; }
            .gallery.A, .gallery.B { aspect-ratio: 1.8 / 1; }
            .gallery.duo { aspect-ratio: auto; grid-template-columns: 1fr 1fr; }
            .p-body.split { grid-template-columns: minmax(0, 1fr); }
            .video-card { padding: 8px; border-radius: 22px; }
            .video-frame { border-radius: 16px; }
        }

        @media (hover: none) {
            .work-card:hover img, .tile:hover img { transform: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; scroll-behavior: auto !important; }
        }
    </style>
</head>

        <a class="home-link" href="index.html" aria-label="Home">

    <div class="nav-overlay" id="nav-overlay">
        <nav class="nav-links" aria-label="Main">

    <!-- GRID VIEW -->

    <main class="view project-view wrap" id="project-view" hidden></main>

    <script>

        const HC   = ['Home Centre', 'Leo Burnett', 'Dejavu', 'Behance'];

        const PROJECTS = [
            {
                id: 'nap-like-a-king', cover: 'images/work-01.jpg',
                client: 'Babyshop,', title: '“Nap Like a King”',
                credits: LB,
                gallery: { layout: 'A', images: g('nap-like-a-king', 3) },
                sections: [

                logos: BABY,

                    ['Campaign Middle East feature', 'https://campaignme.com/why-babyshops-latest-ads-feel-like-a-love-letter-to-90s-advertising/'],
                    ['Campaign Middle East Top 15 recognition', 'https://campaignme.com/the-annual-top-15-film-campaigns-of-2025/'],
                    ['Little Black Book coverage', 'https://lbbonline.com/news/babyshop-unveils-cinematic-brand-campaign-video-directed-by-award-winning-director-trevor-mcmahan'],
                    ['Little Black Book Creative Library', 'https://lbbonline.com/work/128361']
                ]
            },
            {
                id: 'breast-cancer-knows-no-month', cover: 'images/work-02.jpg',
                client: 'Emirates NBD,', title: '“Breast Cancer Knows No Month”',
                credits: LB,
                gallery: { layout: 'B', images: g('breast-cancer-knows-no-month', 3) },
                sections: [
                    ['The opportunity', 'Breast cancer awareness peaks in October. Early detection cannot afford to.'],
                    ['The idea', 'We challenged the calendar itself, turning the pink ATM into an everyday reminder that checking should not belong to one awareness month.'],
                    ['My contribution', 'I helped shape a visual and film language that felt intimate and human without becoming sentimental or overly dramatic. The craft had to give the message emotional weight while keeping the action simple and immediate.'],
                    ['Impact / proof', 'Silver, 2025 MMA SMARTIES MEA, Brand Purpose / Activism.']
                ],
                video: 'https://www.youtube.com/watch?v=AY-4KxtmH_U',
                logos: ['Emirates NBD', 'Aster', 'MMA SMARTIES', 'Leo Burnett', 'Day of Dubai'],
                appendix: [
                    ['Official campaign film:', 'https://www.youtube.com/watch?v=AY-4KxtmH_U'],
                    ['Emirates NBD campaign:', 'https://www.emiratesnbd.com/en/media-center/emirates-nbd-joins-hands-with-aster-hospitals-and-clinics'],
                    ['MMA Global 2025 SMARTIES winners:', 'https://mmaglobal.com/smarties-2025/finalists/winners/region%3A13'],
                    ['Emirates NBD award announcement:', 'https://www.linkedin.com/posts/emirates-nbd_emiratesnbd-mmasmarties-activity-7429496273738749792-Ka5L'],

                appendix: []
            }
        ];

        /* =====================================================================
           HELPERS
        ===================================================== */
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

        const ICON = {
            left:  '<svg viewBox="0 0 40 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M39 7H1M7 1 1 7l6 6"/></svg>',
            right: '<svg viewBox="0 0 40 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1 7h38M33 1l6 6-6 6"/></svg>',
            play:  '<svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg>'
        };

        const logoImg = (name) => `<img class="logo" src="images/logos/${slug(name)}.png" alt="${esc(name)}" data-name="${esc(name)}" loading="lazy">`;

        /* broken image handling: grey tile for photos, text label for logos */
        document.addEventListener('error', (e) => {
            const img = e.target;
            if (img.tagName !== 'IMG') return;
            if (img.classList.contains('logo')) {
                const span = document.createElement('span');
                span.className = 'logo-text';
                span.textContent = img.dataset.name;
                img.replaceWith(span);
            } else if (img.closest('.tile')) {
                img.closest('.tile').classList.add('missing');
            }
        }, true);

        function embedFor(url) {
            const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/);
            return m ? `https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0` : null;
        }

        /* =====================================================================
           GRID
        ===================================================== */
        $('work-grid').innerHTML = PROJECTS.map((p) => `
            <a class="work-card" href="#${p.id}" aria-label="${esc(p.client)} ${esc(p.title)}">
                <img src="${esc(p.cover)}" alt="" loading="lazy">
                <span class="card-caption">
                    <span class="card-client">${esc(p.client)}${p.extra ? ' ' + esc(p.extra) : ''}</span>
                    <span class="card-title">${esc(p.title)}</span>
                </span>
            </a>`).join('');

        const cards = [...document.querySelectorAll('.work-card')];
        const io = new IntersectionObserver((entries) => {
            entries.forEach((en) => {
                if (!en.isIntersecting) return;
                const card = en.target;
                card.style.transitionDelay = ((cards.indexOf(card) % 3) * 60) + 'ms';
                card.classList.add('in');
                setTimeout(() => { card.style.transitionDelay = ''; }, 900);
                io.unobserve(card);
            });
        }, { threshold: 0.08 });
        cards.forEach((c) => io.observe(c));

        /* =====================================================================
           PROJECT PAGE
        ===================================================== */
        function projectHTML(p, i) {
            const prev = PROJECTS[i - 1];
            const next = PROJECTS[i + 1];

            const credits = p.credits ? `
                <div class="credits">
                    <div class="agency">${esc(p.credits.agency)}</div>
                    ${p.credits.roles.map((r) => `<div class="role">${esc(r)}</div>`).join('')}
                </div>` : '';

            const awards = p.awardLogos ? `<div class="awards">${p.awardLogos.map(logoImg).join('')}</div>` : '';

            const tiles = p.gallery.images.map((src, n) =>
                `<div class="tile"><img src="${esc(src)}" alt="${esc(p.client.replace(/,$/, ''))} ${esc(p.title)} — image ${n + 1}" loading="lazy"></div>`).join('');
            const ratio = p.gallery.ratio ? ` style="--ratio:${p.gallery.ratio}"` : '';
            const gallery = `<div class="gallery ${p.gallery.layout}"${ratio}>${tiles}</div>`;

            const deck = p.deck ? `<a class="pill solid p-deck" href="${esc(p.deck.href)}" download>${esc(p.deck.label)}</a>` : '';

            const secHTML = (list) => list.map(([h, t]) => `<div class="sec"><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join('');

            let body = '';
            if (p.video) {
                const poster = `images/work/${p.id}/poster.jpg`;
                body = `
                <div class="p-body">
                    <div class="col">${secHTML(p.sections)}</div>
                    <div class="col media">
                        <div class="video-card">
                            <div class="video-frame" data-src="${esc(p.video)}">
                                <img src="${poster}" alt="${esc(p.client.replace(/,$/, ''))} ${esc(p.title)} — film poster">
                                <button class="play-btn" type="button" aria-label="Play film">${ICON.play}<span>click to play</span></button>
                            </div>
                        </div>
                        <div class="logos">${p.logos.map(logoImg).join('')}</div>
                    </div>
                </div>`;
            } else if (p.split) {
                body = `
                <div class="p-body split">
                    <div class="col">${secHTML(p.sections.slice(0, p.split))}</div>
                    <div class="col">${secHTML(p.sections.slice(p.split))}</div>
                </div>
                ${p.logos.length ? `<div class="logos left${p.logosSmall ? ' small' : ''}">${p.logos.map(logoImg).join('')}</div>` : ''}`;
            } else if (p.sections.length) {
                body = `<div class="p-body solo"><div class="col">${secHTML(p.sections)}</div></div>`;
            }

            const appendix = p.appendix.length ? `
                <section class="appendix" aria-label="Appendix">
                    <h2>Appendix</h2>
                    <ul>${p.appendix.map(([label, url]) =>
                        `<li><b>${esc(label)}</b><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></li>`).join('')}</ul>
                </section>` : '';

            return `
                <hr class="rule">
                <a class="p-back" href="work.html">Work</a>

                <div class="p-head">
                    <h1 class="p-title">
                        <span class="p-client">${esc(p.client)}</span>
                        <span class="p-name">${p.extra ? `<span class="extra">${esc(p.extra)}</span> ` : ''}${esc(p.title)}</span>
                    </h1>
                    <nav class="p-nav" aria-label="Projects">
                        ${prev ? `<a href="#${prev.id}">${ICON.left} Previous Project</a>` : ''}
                        ${next ? `<a href="#${next.id}">Next Project ${ICON.right}</a>` : ''}
                    </nav>
                </div>

                ${credits}
                ${awards}
                ${gallery}
                ${deck}
                ${body}
                ${appendix}
                <hr class="rule p-end">`;
        }

        /* =====================================================================
           ROUTER   (#  → grid ·  #<project-id> → project)
        ===================================================== */
        const gridView = $('grid-view');
        const projectView = $('project-view');
        let current = -1;

        function route() {
            const id = location.hash.replace('#', '');
            const index = PROJECTS.findIndex((p) => p.id === id);
            current = index;

            if (index === -1) {
                projectView.hidden = true;
                gridView.hidden = false;
                document.body.dataset.view = 'grid';
                document.title = 'Work - Syed Shuja';
                window.scrollTo(0, 0);
                return;
            }

            const show = () => {
                gridView.hidden = true;
                projectView.hidden = false;
                projectView.innerHTML = projectHTML(PROJECTS[index], index);
                document.body.dataset.view = 'project';
                document.title = `${PROJECTS[index].client.replace(/,$/, '')} ${PROJECTS[index].title} — Work - Syed Shuja`;
                window.scrollTo(0, 0);
                requestAnimationFrame(() => projectView.classList.remove('fade'));
            };

            projectView.classList.add('fade');
            projectView.hidden ? show() : setTimeout(show, 260);
        }

        window.addEventListener('hashchange', route);
        route();

        /* the "Work" link on a project page returns to the grid in this same file */
        projectView.addEventListener('click', (e) => {
            const back = e.target.closest('.p-back');
            if (back) { e.preventDefault(); location.hash = ''; history.replaceState(null, '', location.pathname); route(); return; }

            const play = e.target.closest('.play-btn');
            if (!play) return;
            const frame = play.closest('.video-frame');
            const src = frame.dataset.src;
            const embed = embedFor(src);
            let el;
            if (embed) {
                el = document.createElement('iframe');
                el.src = embed;
                el.allow = 'autoplay; fullscreen; picture-in-picture';
                el.allowFullscreen = true;
                el.title = 'Project film';
            } else {
                el = document.createElement('video');
                el.src = src;
                el.controls = true;
                el.autoplay = true;
                el.playsInline = true;
            }
            frame.replaceChildren(el);
        });

        /* keyboard: ← → between projects, Esc back to the grid */
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if ($('nav-overlay').classList.contains('open')) toggleMenu(false);
                else if (current > -1) { history.replaceState(null, '', location.pathname); route(); }
                return;
            }
            if (current < 0 || $('nav-overlay').classList.contains('open')) return;
            if (e.key === 'ArrowRight' && PROJECTS[current + 1]) location.hash = PROJECTS[current + 1].id;
            if (e.key === 'ArrowLeft' && PROJECTS[current - 1]) location.hash = PROJECTS[current - 1].id;
        });

        /* =====================================================================
           MENU + SCROLLED TOP BAR
        ===================================================== */
        const menuBtn = $('menu-btn');
        const navOverlay = $('nav-overlay');

        function toggleMenu(force) {
            const open = typeof force === 'boolean' ? force : !navOverlay.classList.contains('open');
            menuBtn.classList.toggle('open', open);
            navOverlay.classList.toggle('open', open);
            menuBtn.setAttribute('aria-expanded', String(open));
            document.body.classList.toggle('lock', open);
        }

        menuBtn.addEventListener('click', () => toggleMenu());
        $('menu-label').addEventListener('click', () => toggleMenu());
        navOverlay.querySelectorAll('a').forEach((a) => a.addEventListener('click', (e) => {
            toggleMenu(false);
            if (a.getAttribute('href') === 'work.html') {          /* already on this page: just show the grid */
                e.preventDefault();
                history.replaceState(null, '', location.pathname);
                route();
            }
        }));

        const topBar = $('top-bar');
        const onScroll = () => topBar.classList.toggle('scrolled', window.scrollY > 24);
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
    </script>

</body>
</html>
