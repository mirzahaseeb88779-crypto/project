<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio Concept - Syed Shuja</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@700;800;900&family=Alegreya:wght@400&family=Playfair+Display:ital,wght@1,700&family=Inter:wght@400;700;900&display=swap');



        :root {

            --bg-color: #ece9e2;

            --text-color: #0a0a0a;



            /* ───── DESKTOP SETTINGS ───── */

            --title-size: min(18.8vw, 40vh);

            --title-top: 33%;

            --title-gap: 0.35cm;      /* each word moves 0.35cm from centre = 0.7cm total gap */

            --person-height: 80vh;

            --person-bottom: 3vh;

            --person-left: 48%;

            --person-tilt: 0deg;

            --cols-top: 57%;

            --logo-max-h: 28vh;

            --left-col-left: 17%;   --left-col-w: 23%;

            --right-col-left: 62%;  --right-col-w: 23%;

            --mobile-zoom: 1;

        }



        *, *::before, *::after { box-sizing: border-box; }



        body, html {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            background-color: var(--bg-color);

            font-family: 'Inter', sans-serif;

        }



        /* ─── NAVBAR ─────────────────────────────────────── */

        .nav-logo {

            position: fixed;

            top: 30px;

            left: 40px;

            font-family: 'Playfair Display', serif;

            font-style: italic;

            font-size: 32px;

            font-weight: 700;

            color: var(--text-color);

            z-index: 200;

            cursor: pointer;

        }



        .menu-btn {

            position: fixed;

            top: 38px;

            right: 40px;

            width: 35px;

            height: 22px;

            cursor: pointer;

            z-index: 200;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

        }



        .menu-btn .line {

            width: 100%;

            height: 3px;

            background-color: var(--text-color);

            border-radius: 2px;

            transition: all 0.3s ease-in-out;

        }



        .menu-btn.open .line:nth-child(1) { transform: translateY(9.5px) rotate(45deg); }

        .menu-btn.open .line:nth-child(2) { opacity: 0; }

        .menu-btn.open .line:nth-child(3) { transform: translateY(-9.5px) rotate(-45deg); }



        /* ─── NAV OVERLAY ────────────────────────────────── */

        .nav-overlay {

            position: fixed;

            inset: 0;

            background-color: rgba(236, 233, 226, 0.98);

            z-index: 150;

            display: flex;

            justify-content: center;

            align-items: center;

            opacity: 0;

            visibility: hidden;

            transition: opacity 0.4s ease, visibility 0.4s ease;

        }



        .nav-overlay.open { opacity: 1; visibility: visible; }



        .nav-links {

            display: flex;

            flex-direction: column;

            text-align: center;

            gap: 30px;

            transform: translateY(20px);

            transition: transform 0.4s ease;

        }



        .nav-overlay.open .nav-links { transform: translateY(0); }



        .nav-links a {

            font-size: clamp(40px, 8vw, 80px);

            font-weight: 900;

            color: var(--text-color);

            text-decoration: none;

            letter-spacing: -0.04em;

            line-height: 1;

            transition: color 0.3s, transform 0.3s;

        }



        .nav-links a:hover { color: #777; transform: scale(1.05); }



        /* ─── STAGE + COMPOSITION ────────────────────────── */

        .stage {

            position: relative;

            width: 100%;

            height: 100vh;

            overflow: hidden;

            background-color: var(--bg-color);

        }



        .composition {

            position: absolute;

            inset: 0;

            background-color: var(--bg-color);

        }



        /* ─── TITLE LAYERS:  "Syed" (1) → person (5) → "Shuja" (10) ── */

        .background-layer {

            position: absolute;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

        }



        .huge-title {

            position: absolute;

            top: var(--title-top);

            left: calc(50% - 0.117em);

            font-family: 'Figtree', 'Inter', sans-serif;

            font-size: var(--title-size);

            font-weight: 800;

            letter-spacing: -0.045em;

            color: var(--text-color);

            margin: 0;

            line-height: 0.85;

            white-space: nowrap;

            user-select: none;

            --px: 0px;

            --py: 0px;

        }



        .huge-title-left {

            z-index: 1;

            transform: translate(calc(-100% - var(--title-gap) + var(--px)), calc(-50% + var(--py)));

        }



        .huge-title-right {

            z-index: 10;

            transform: translate(calc(var(--title-gap) + var(--px)), calc(-50% + var(--py)));

        }



        /* ─── CENTER PERSON ──────────────────────────────── */

        .person-wrapper {

            position: absolute;

            left: var(--person-left);

            bottom: var(--person-bottom);

            height: var(--person-height);

            z-index: 5;

            pointer-events: none;

            transform: translateX(-50%) translate(var(--px, 0px), var(--py, 0px)) rotate(var(--person-tilt));

        }



        .person-wrapper img {

            height: 100%;

            width: auto;

            display: block;

            filter: grayscale(1) contrast(1.1);

            opacity: 0;

        }



        .person-wrapper img.ready { opacity: 1; }



        .person-wrapper.fallback { mix-blend-mode: multiply; }



        /* ─── LOGO COLUMNS ───────────────────────────────── */

        .column {

            position: absolute;

            top: var(--cols-top);

            z-index: 3;

            display: flex;

            flex-direction: column;

            mix-blend-mode: multiply;

        }



        .left-column  { left: var(--left-col-left);  width: var(--left-col-w); }

        .right-column { left: var(--right-col-left); width: var(--right-col-w); }



        .subtitle {

            font-family: 'Alegreya', serif;

            color: #8c8881;

            font-size: clamp(11px, 1.05vw, 17px);

            line-height: 1.25;

            margin-bottom: 1.2vw;

        }



        .left-column .subtitle  { text-align: right; }

        .right-column .subtitle { text-align: left; }



        .mbr { display: none; }



        .logo-img {

            display: block;

            width: auto;

            max-width: 100%;

            height: auto;

            max-height: var(--logo-max-h);

            filter: grayscale(1) contrast(1.15);

        }



        .left-column .logo-img { margin-left: auto; }



        .m-logos { display: none; }



        /* ─── MOBILE (measured from the mobile inspo: 1661 × 1943) ── */

        @media (max-width: 900px) {

            :root {

                --title-size: 15.1cqw;

                --title-top: 28%;

                --title-gap: 1cqw;

                --person-height: 88.7%;

                --person-bottom: -1.3%;

                --person-left: 48.1%;

                --person-tilt: 0deg;      /* if his boot sits too far right, try 2deg */

                --cols-top: 38.5%;

                --logo-max-h: none;

                --left-col-left: 18.4%;  --left-col-w: 21.7%;

                --right-col-left: 60.1%; --right-col-w: 22%;

            }



            .nav-logo { top: 18px; left: 22px; font-size: 26px; }

            .menu-btn { top: 22px; right: 22px; }

            .nav-links a { font-size: 44px; }



            .stage {

                height: 100vh;

                height: 100svh;

                display: flex;

                align-items: center;

                justify-content: center;

            }



            .composition {

                position: relative;

                inset: auto;

                flex: none;

                width: calc(min(100vw, 85.5vh) * var(--mobile-zoom));

                width: calc(min(100vw, 85.5svh) * var(--mobile-zoom));

                aspect-ratio: 1661 / 1943;

                container-type: inline-size;

            }



            .mbr { display: inline; }



            .subtitle {

                font-size: max(8px, 1.85cqw);

                line-height: 1.1;

                margin-bottom: 0.5cqw;

            }



            .left-column .subtitle  { padding-right: 1.5cqw; }

            .right-column .subtitle { padding-left: 3.5cqw; }



            .logo-img { width: 100%; }

            .left-column .logo-img { margin-left: 0; }



            .column.sliced .logo-img { display: none; }

            .column.sliced .m-logos {

                display: flex;

                flex-direction: column;

                width: 100%;

            }



            .m-row { display: flex; align-items: center; width: 100%; }

            .m-row img {

                display: block;

                height: auto;

                filter: grayscale(1) contrast(1.15);

            }
    </style>

</head>

<body>



    <!-- NAVBAR -->

    <div class="nav-logo">hello,i'm</div>



    <div class="menu-btn" id="menu-btn">

        <div class="line"></div>

        <div class="line"></div>

        <div class="line"></div>

    </div>



    <div class="nav-overlay" id="nav-overlay">

        <nav class="nav-links">

            <a href="index.html">Hello</a>

            <a href="work.html">Work</a>

            <a href="about.html">About</a>

            <a href="contact.html">Contact</a>

        </nav>

    </div>



    <div class="stage">

        <div class="composition">



            <!-- BIG TITLE: "Syed" behind the person, "Shuja" in front -->

            <div class="background-layer">

                <h1 class="huge-title huge-title-left">Syed</h1>

                <h1 class="huge-title huge-title-right">Shuja</h1>

            </div>



            <!-- LEFT: brand logos -->

            <div class="column left-column" id="brands-col">

                <div class="subtitle">crafted brands<br class="mbr"> y'all love</div>

                <img class="logo-img" id="brands-img" src="images/Untitled-1.png" alt="Brand logos">

                <div class="m-logos" id="brands-m"></div>

            </div>



            <!-- CENTER: person -->

            <div class="person-wrapper" id="person-container">

                <img id="person-img" src="images/G5D_9399_2 copy.png" alt="Syed Shuja">

            </div>



            <!-- RIGHT: agency logos -->

            <div class="column right-column" id="agencies-col">

                <div class="subtitle">and worked with<br class="mbr"> agencies y'all know</div>

                <img class="logo-img" id="agencies-img" src="images/AgenciesLogos.png" alt="Agency logos">

                <div class="m-logos" id="agencies-m"></div>

            </div>



        </div>

    </div>

</section>

    <script>

        const menuBtn    = document.getElementById('menu-btn');

        const navOverlay = document.getElementById('nav-overlay');



        menuBtn.addEventListener('click', () => {

            menuBtn.classList.toggle('open');

            navOverlay.classList.toggle('open');

        });



        document.querySelectorAll('.nav-links a').forEach(link => {

            link.addEventListener('click', () => {

                menuBtn.classList.remove('open');

                navOverlay.classList.remove('open');

            });

        });



        // ─── MOBILE LOGOS: slice the flat logo images into single logos ───

        // crops = { logoIndex: fractionToCutFromTheLeft }  (used to drop the DWTC diamond)

        function sliceLogos(img, rowGapF, colGapF, crops) {

            const W = img.naturalWidth, H = img.naturalHeight;

            const c = document.createElement('canvas');

            c.width = W; c.height = H;

            const ctx = c.getContext('2d');

            ctx.drawImage(img, 0, 0);

            const d = ctx.getImageData(0, 0, W, H).data;          // throws on file://

            const ink = (x, y) => {

                const p = (y * W + x) * 4;

                return d[p + 3] > 20 && (d[p] + d[p + 1] + d[p + 2]) / 3 < 225;

            };



            // tight bounding box of the ink inside a region

            const tight = (x0, y0, x1, y1) => {

                let ax = x1, bx = x0, ay = y1, by = y0;

                for (let y = y0; y <= y1; y++)

                    for (let x = x0; x <= x1; x++)

                        if (ink(x, y)) {

                            if (x < ax) ax = x; if (x > bx) bx = x;

                            if (y < ay) ay = y; if (y > by) by = y;

                        }

                return { x: ax, y: ay, w: bx - ax + 1, h: by - ay + 1 };

            };



            const bands = (len, has, gap) => {

                const out = []; let start = -1, last = -1;

                for (let i = 0; i < len; i++) {

                    if (!has(i)) continue;

                    if (start < 0) start = i;

                    else if (i - last > gap) { out.push([start, last]); start = i; }

                    last = i;

                }

                if (start >= 0) out.push([start, last]);

                return out;

            };



            const rowInk = new Array(H).fill(0);

            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (ink(x, y)) rowInk[y]++;



            const boxes = [];

            bands(H, y => rowInk[y] >= 2, rowGapF * H).forEach(([y0, y1]) => {

                const colInk = new Array(W).fill(0);

                for (let x = 0; x < W; x++) for (let y = y0; y <= y1; y++) if (ink(x, y)) colInk[x]++;

                bands(W, x => colInk[x] >= 2, colGapF * W).forEach(([x0, x1]) => boxes.push(tight(x0, y0, x1, y1)));

            });



            Object.entries(crops || {}).forEach(([i, f]) => {

                const b = boxes[i];

                if (b) boxes[i] = tight(b.x + Math.round(f * b.w), b.y, b.x + b.w - 1, b.y + b.h - 1);

            });



            return boxes.map(b => {

                const cc = document.createElement('canvas');

                cc.width = b.w; cc.height = b.h;

                cc.getContext('2d').drawImage(img, b.x, b.y, b.w, b.h, 0, 0, b.w, b.h);

                return cc.toDataURL('image/png');

            });

        }



        // row = { r: [[logoIndex, widthInPercentOfColumn], ...],

        //         a: alignment for a single-logo row, mt: top gap (cqw), pl/pr: side offsets (cqw) }

        function buildStack(colId, imgId, boxId, expected, rowGapF, colGapF, rows, align, crops) {

            const col = document.getElementById(colId);

            const img = document.getElementById(imgId);

            const box = document.getElementById(boxId);



            const run = () => {

                try {

                    const logos = sliceLogos(img, rowGapF, colGapF, crops);

                    if (logos.length !== expected) return;           // different logo count → keep flat image

                    rows.forEach(({ r: items, a, mt = 0, pl = 0, pr = 0 }) => {

                        const row = document.createElement('div');

                        row.className = 'm-row';

                        row.style.marginTop = mt + 'cqw';

                        row.style.justifyContent = items.length > 1 ? 'space-between' : (a || align);

                        items.forEach(([i, w], k) => {

                            const el = document.createElement('img');

                            el.src = logos[i];

                            el.alt = '';

                            el.style.width = w + '%';

                            if (k === 0) el.style.marginLeft = pl + 'cqw';

                            if (k === items.length - 1) el.style.marginRight = pr + 'cqw';

                            row.appendChild(el);

                        });

                        box.appendChild(row);

                    });

                    col.classList.add('sliced');

                } catch (e) { /* keep the flat image */ }

            };



            if (img.complete && img.naturalWidth) run();

            else img.addEventListener('load', run, { once: true });

        }



        // LEFT: flat image order = Ferrero, Pepsi, Visa, McDonald's, Burger King, Mastercard, KFC, Sanofi

        // (row 2 has an empty left slot, that's where Starbucks goes)

        buildStack('brands-col', 'brands-img', 'brands-m', 8, 0.08, 0.025, [

            { r: [[4, 42], [1, 39]], mt: 0.4 },                    // Burger King | Pepsi

            { r: [[3, 43]], a: 'flex-end', mt: 0.9 },              //   —         | McDonald's

            { r: [[0, 99]], mt: 2.8 },                             // Ferrero

            { r: [[2, 46], [6, 33]], mt: 2.1 },                    // Visa        | KFC

            { r: [[7, 54], [5, 28]], mt: 2.2, pl: 1.1, pr: 0.6 }   // Sanofi      | Mastercard

        ], 'flex-start');



        // RIGHT: flat image order = Havas, DWTC, Ogilvy, Leo Burnett, Impact BBDO, Publicis, TBWA, FP7

        // DWTC is cropped (33% from the left) to drop the diamond, like the inspo

        buildStack('agencies-col', 'agencies-img', 'agencies-m', 8, 0.03, 0.05, [

            { r: [[1, 77]], mt: 1.45, pr: 0.4 },    // DWTC

            { r: [[3, 90]], mt: 1.8 },              // Leo Burnett

            { r: [[5, 68]], mt: 2.0, pr: 1.3 },     // Publicis

            { r: [[2, 48]], mt: 2.3, pr: 1.4 },     // Ogilvy

            { r: [[6, 70]], mt: 3.4, pr: 0.6 },     // TBWARAAD

            { r: [[4, 82]], mt: 3.3 },              // Impact BBDO

            { r: [[7, 74]], mt: 3.0, pr: 0.2 },     // FP7McCANN

            { r: [[0, 77]], mt: 2.6, pr: 0.4 }      // Havas

        ], 'flex-end', { 1: 0.33 });



        // ─── AUTO CUTOUT: removes the white photo background ───────────

        const personImg     = document.getElementById('person-img');

        const personWrapper = document.getElementById('person-container');

        const WHITE_LIMIT   = 215;   // lower = removes more of the grey glow/shadow

        const MAX_SIDE      = 1800;

        let cutoutDone = false;



        function makeCutout() {

            if (cutoutDone) return;

            cutoutDone = true;



            try {

                const scale = Math.min(1, MAX_SIDE / Math.max(personImg.naturalWidth, personImg.naturalHeight));

                const w = Math.round(personImg.naturalWidth * scale);

                const h = Math.round(personImg.naturalHeight * scale);



                const canvas = document.createElement('canvas');

                canvas.width = w;

                canvas.height = h;

                const ctx = canvas.getContext('2d');

                ctx.drawImage(personImg, 0, 0, w, h);



                const imgData = ctx.getImageData(0, 0, w, h);   // throws on file://

                const px = imgData.data;



                const isBg = (i) => {

                    const p = i * 4;

                    return px[p + 3] < 10 ||

                           (px[p] > WHITE_LIMIT && px[p + 1] > WHITE_LIMIT && px[p + 2] > WHITE_LIMIT);

                };



                const removed = new Uint8Array(w * h);

                const stack = [];

                const seed = (i) => { if (!removed[i] && isBg(i)) { removed[i] = 1; stack.push(i); } };



                for (let x = 0; x < w; x++) { seed(x); seed((h - 1) * w + x); }

                for (let y = 0; y < h; y++) { seed(y * w); seed(y * w + w - 1); }



                while (stack.length) {

                    const i = stack.pop();

                    const x = i % w, y = (i / w) | 0;

                    if (x > 0)     seed(i - 1);

                    if (x < w - 1) seed(i + 1);

                    if (y > 0)     seed(i - w);

                    if (y < h - 1) seed(i + w);

                }



                for (let i = 0; i < w * h; i++) {

                    if (removed[i]) { px[i * 4 + 3] = 0; continue; }

                    const x = i % w, y = (i / w) | 0;

                    const nearBg = (x > 0 && removed[i - 1]) || (x < w - 1 && removed[i + 1]) ||

                                   (y > 0 && removed[i - w]) || (y < h - 1 && removed[i + w]);

                    if (nearBg) {

                        const lum = (px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]) / 3;

                        if (lum > 170) px[i * 4 + 3] = Math.max(0, Math.min(255, (255 - lum) * 3));

                    }

                }



                ctx.putImageData(imgData, 0, 0);

                personImg.addEventListener('load', () => personImg.classList.add('ready'), { once: true });

                personImg.src = canvas.toDataURL('image/png');

            } catch (err) {

                personWrapper.classList.add('fallback');

                personImg.classList.add('ready');

            }

        }



        if (personImg.complete && personImg.naturalWidth) makeCutout();

        else personImg.addEventListener('load', makeCutout, { once: true });



        // ─── Mouse parallax (desktop only) ─────────────────────────────

        const titleLeft  = document.querySelector('.huge-title-left');

        const titleRight = document.querySelector('.huge-title-right');

        const navLogo    = document.querySelector('.nav-logo');



        document.addEventListener('mousemove', (e) => {

            if (window.innerWidth <= 900) return;



            const x = (e.clientX / window.innerWidth  - 0.5) * 2;

            const y = (e.clientY / window.innerHeight - 0.5) * 2;



            [titleLeft, titleRight].forEach(t => {

                t.style.setProperty('--px', (x * 14) + 'px');

                t.style.setProperty('--py', (y * 8) + 'px');

            });



            personWrapper.style.setProperty('--px', (x * -18) + 'px');

            personWrapper.style.setProperty('--py', (y * -8) + 'px');

            navLogo.style.transform = `translate(${x * -4}px, ${y * -4}px)`;

        });
    </script>

</body>

</html>
